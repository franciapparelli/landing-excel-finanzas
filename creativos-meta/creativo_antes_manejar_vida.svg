<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <filter id="pill-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Top Banner Background -->
  <rect x="0" y="0" width="1080" height="260" fill="#F8F3EA" />

  <!-- Top Banner Headline -->
  <text x="540" y="115" font-family="'DejaVu Sans', -apple-system, sans-serif" font-size="52" font-weight="800" fill="#223120" text-anchor="middle" letter-spacing="-1">
    ¿5 apps para manejar tu vida?
  </text>
  <text x="540" y="185" font-family="'DejaVu Sans', -apple-system, sans-serif" font-size="54" font-weight="800" fill="#223120" text-anchor="middle" letter-spacing="-1">
    Probá una.
  </text>

  <!-- Photo Area -->
  <g transform="translate(0, 260)">
    <image href="/home/fran/Programming/landing-excel-finanzas/creativos-meta/flatlay_desk_before.jpg" x="0" y="0" width="1080" height="820" preserveAspectRatio="xMidYMid slice" />

    <!-- 'antes' Pill Top-Left -->
    <g transform="translate(50, 35)">
      <rect width="120" height="46" rx="23" fill="#F8F4EC" stroke="#E5DFC4" stroke-width="1.5" filter="url(#pill-shadow)" />
      <text x="60" y="30" font-family="'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" fill="#2A3828" text-anchor="middle">
        antes
      </text>
    </g>

    <!-- '1/7' Pill Bottom-Center -->
    <g transform="translate(490, 740)">
      <rect width="100" height="46" rx="23" fill="#223120" filter="url(#pill-shadow)" />
      <text x="50" y="30" font-family="'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
        1/7
      </text>
    </g>
  </g>
</svg>